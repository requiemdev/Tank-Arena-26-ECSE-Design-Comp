<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECSE Tank Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101419;
        --panel: #1b242d;
        --panel-2: #24313c;
        --text: #f5f7fa;
        --muted: #a9b5bf;
        --accent: #34c759;
        --danger: #ff453a;
        --line: #34424f;
      }

      * {
        box-sizing: border-box;
      }

      .setup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .setup label:first-child {
        grid-column: 1 / -1;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
      }

      .dot.connected {
        background: var(--accent);
      }

      #joystick {
        width: 25vw;
        aspect-ratio: 1;
        position: relative;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      @media (min-width: 780px) {
        main {
          max-width: 860px;
          margin: 0 auto;
          padding: 24px;
        }

        .setup {
          grid-template-columns: 2fr 1fr 1fr;
        }

        .setup label:first-child {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="p-2 text-sm">
      <div class="flex justify-between items-center">
        <h1 class="font-bold">Tank Controller</h1>

        <div class="status h-2">
          <span id="statusDot" class="dot"></span
          ><span id="statusText">Disconnected</span>
        </div>
      </div>

      <div class="text-xs flex gap-5 pt-2">
        <label>
          Edge server
          <input id="serverUrl" autocomplete="off" />
        </label>
        <label>
          Player
          <select id="player">
            <option value="p1">Player 1</option>
            <option value="p2">Player 2</option>
          </select>
        </label>
        <label>
          Name
          <input id="username" autocomplete="name" value="Driver" />
        </label>
      </div>

      <div class="flex gap-4 text-center items-center pt-2">
        <div class="flex items-center gap-2 w-full">
          <div class="w-12">HP</div>
          <div class="flex-1 bg-gray-300 rounded-full h-2">
            <div class="bg-blue-500 h-2 rounded-full" style="width: 45%"></div>
          </div>
        </div>

        <div class="border-l-2 h-6"></div>

        <div class="flex items-center gap-2 w-full">
          <div class="w-16">Shield</div>
          <div class="flex-1 bg-gray-300 rounded-full h-2">
            <div class="bg-blue-500 h-2 rounded-full" style="width: 45%"></div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 pt-2">
        <div class="pad" aria-label="Joystick">
          <div id="joystick" class=""></div>
        </div>

        <div class="actions flex-1 grid grid-cols-2 gap-2">
          <button id="connect" class="border-2 p-2 bg-green-500" type="button">
            Connect
          </button>

          <button id="start" class="border-2 p-2 bg-green-500" type="button">
            Start
          </button>

          <button id="fire" class="danger col-span-2 border-2 p-2 bg-red-500">
            Fire
          </button>
        </div>
      </div>

      <section class="flex gap-5 ps-5" aria-live="polite">
        <div>Throttle <strong id="throttle">0.00</strong></div>
        <div>Steering <strong id="steering">0.00</strong></div>
      </section>
    </div>

    <script>
      const serverUrlInput = document.querySelector("#serverUrl");
      const playerInput = document.querySelector("#player");
      const usernameInput = document.querySelector("#username");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const throttleText = document.querySelector("#throttle");
      const steeringText = document.querySelector("#steering");
      const connectButton = document.querySelector("#connect");
      const startButton = document.querySelector("#start");
      const fireButton = document.querySelector("#fire");

      const defaultProtocol =
        window.location.protocol === "https:" ? "wss:" : "ws:";
      serverUrlInput.value = `${defaultProtocol}//${window.location.host}/connect`;

      let socket;
      let seq = 0;
      let latest = { throttle: 0, steering: 0, fire: false };
      let sendTimer;

      const joystickZone = document.querySelector("#joystick");

      if (window.nipplejs) {
        const joystick = nipplejs.create({
          zone: joystickZone,
          mode: "static",
          position: { left: "50%", top: "50%" },
          color: "#f5f7fa",
          size: 190,
        });

        joystick.on("move", (_event, data) => {
          latest = {
            ...latest,
            throttle: clamp(-(data.vector?.y ?? 0)),
            steering: clamp(data.vector?.x ?? 0),
          };
          renderAxes();
        });

        joystick.on("end", stopMoving);
      } else {
        joystickZone.style.border = "1px solid var(--line)";
        joystickZone.style.borderRadius = "50%";
        joystickZone.addEventListener("pointerdown", handleFallbackPointer);
        joystickZone.addEventListener("pointermove", handleFallbackPointer);
        joystickZone.addEventListener("pointerup", stopMoving);
        joystickZone.addEventListener("pointercancel", stopMoving);
      }

      connectButton.addEventListener("click", () => {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.close();
          return;
        }
        connect();
      });

      startButton.addEventListener("click", () => sendJson({ type: "start" }));

      fireButton.addEventListener("pointerdown", () => {
        latest.fire = true;
        sendInput();
      });

      fireButton.addEventListener("pointerup", () => {
        latest.fire = false;
        sendInput();
      });

      fireButton.addEventListener("pointercancel", () => {
        latest.fire = false;
        sendInput();
      });

      function connect() {
        const url = new URL(serverUrlInput.value);
        url.searchParams.set("type", "controller");
        url.searchParams.set("player", playerInput.value);
        url.searchParams.set("username", usernameInput.value || "Driver");

        setStatus("Connecting", false);
        socket = new WebSocket(url);

        socket.addEventListener("open", () => {
          setStatus("Connected", true);
          connectButton.textContent = "Disconnect";
          sendTimer = window.setInterval(sendInput, 50);
        });

        socket.addEventListener("close", () => {
          window.clearInterval(sendTimer);
          setStatus("Disconnected", false);
          connectButton.textContent = "Connect";
        });

        socket.addEventListener("error", () =>
          setStatus("Connection error", false),
        );
      }

      function sendInput() {
        sendJson({
          throttle: latest.throttle,
          steering: latest.steering,
          fire: latest.fire,
          seq: ++seq,
          ts: Date.now(),
        });
      }

      function sendJson(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function handleFallbackPointer(event) {
        if (event.buttons === 0) {
          return;
        }

        const rect = joystickZone.getBoundingClientRect();
        const radius = rect.width / 2;
        latest = {
          ...latest,
          throttle: clamp((rect.top + radius - event.clientY) / radius),
          steering: clamp((event.clientX - rect.left - radius) / radius),
        };
        renderAxes();
      }

      function stopMoving() {
        latest = { ...latest, throttle: 0, steering: 0 };
        renderAxes();
        sendInput();
      }

      function setStatus(text, connected) {
        statusText.textContent = text;
        statusDot.classList.toggle("connected", connected);
      }

      function renderAxes() {
        throttleText.textContent = latest.throttle.toFixed(2);
        steeringText.textContent = latest.steering.toFixed(2);
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, value));
      }
    </script>
  </body>
</html>
