<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ECSE Tank Controller</title>

    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle, #1f2937, #030712);
        font-family: Arial, sans-serif;
      }

      /* MAIN CONTROLLER */

      #controller {
        height: 100dvh;
        width: 100vw;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: clamp(8px, 2vw, 25px);
        gap: clamp(8px, 3vw, 40px);
      }

      /* LEFT JOYSTICK PANEL */

      .left-control {
        width: 30vw;
        height: 85dvh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: clamp(8px, 1.5vw, 20px);

        background: rgba(31, 41, 55, 0.6);

        border: 3px solid #374151;
        border-radius: clamp(15px, 3vw, 30px);
      }

      #joystick {
        width: 100%;
        height: 45dvh;

        touch-action: none;
      }

      /* DEBUG */

      #debug {
        width: 100%;

        margin-top: 80px;

        padding: clamp(5px, 1dvh, 10px);

        background: #111827;

        border-radius: 15px;

        color: white;

        text-align: center;

        font-size: clamp(9px, 1.5dvh, 14px);

        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .debug-row {
        display: flex;
        justify-content: space-around;
        width: 100%;
      }

      .debug-row div {
        flex: 1;
      }

      /* CENTER SCREEN */

      #screen {
        width: 32vw;

        height: 75dvh;

        background: #111827;

        border: 5px solid #4b5563;

        border-radius: clamp(15px, 3vw, 35px);

        color: white;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      #loginScreen,
      #hud {
        width: 80%;
      }

      .input {
        width: 100%;

        padding: clamp(6px, 1.5dvh, 12px);

        font-size: clamp(12px, 2dvh, 18px);

        border-radius: 12px;

        margin: 8px 0;
      }

      .btn {
        padding: clamp(6px, 1.5dvh, 12px);

        font-size: clamp(12px, 2dvh, 18px);

        border-radius: 12px;

        cursor: pointer;
        font-weight: bold;
      }

      .blue {
        background: #2563eb;
        color: white;
      }

      .green {
        background: #059669;
        color: white;
      }

      /* RIGHT SIDE */

      .right-control {
        width: 30vw;
        height: 85dvh;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        gap: clamp(8px, 3dvh, 35px);

        background: rgba(31, 41, 55, 0.6);

        border: 3px solid #374151;

        border-radius: clamp(15px, 3vw, 30px);
      }

      /* FIRE */

      #fire {
        width: clamp(90px, 22dvh, 220px);

        height: clamp(90px, 22dvh, 220px);

        border-radius: 50%;

        font-size: clamp(20px, 5dvh, 45px);

        border-width: clamp(3px, 0.8dvh, 8px);

        background: #dc2626;
        border-style: solid;
        border-color: #991b1b;
        color: white;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }

      /* ROTATE */

      .rotate-btn {
        width: clamp(50px, 11dvh, 100px);

        height: clamp(50px, 11dvh, 100px);

        font-size: clamp(25px, 6dvh, 45px);

        border-radius: 50%;

        background: #2563eb;
        border-style: solid;
        border-color: #1e40af;
        color: white;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }

      #fire:active,
      .rotate-btn:active {
        transform: scale(0.9);
      }

      @media (max-height: 600px) {
        .left-control,
        .right-control {
          height: 90dvh;
        }

        #screen {
          height: 80dvh;
        }

        #debug {
          font-size: 12px;
        }

        #fire {
          width: 120px;
          height: 120px;
        }

        .rotate-btn {
          width: 60px;
          height: 60px;
          border-width: clamp(3px, 0.6dvh, 6px);
        }

        /* HP / SHIELD BARS */

        .bar {
          width: 100%;
          height: 20px;

          background: #374151;

          border-radius: 10px;

          overflow: hidden;

          margin-top: 8px;
        }

        #healthBar {
          height: 100%;
          width: 100%;

          background: #22c55e;
        }

        #shieldBar {
          height: 100%;
          width: 100%;

          background: #38bdf8;
        }

        #loginScreen h1 {
          font-size: clamp(18px, 4dvh, 32px);
        }

        #hud h2 {
          font-size: clamp(16px, 3.5dvh, 28px);
        }

        #hud {
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <div id="controller">
      <!-- LEFT JOYSTICK -->

      <div class="left-control">
        <div id="joystick"></div>

        <div id="debug">
          <div class="debug-row">
            <div>
              Throttle:
              <strong id="throttle">0.00</strong>
            </div>

            <div>
              Steering:
              <strong id="steering">0.00</strong>
            </div>
          </div>

          <div class="debug-row">
            <div>
              Fire:
              <strong id="fireState">OFF</strong>
            </div>

            <div>
              Left:
              <strong id="leftState">OFF</strong>
            </div>

            <div>
              Right:
              <strong id="rightState">OFF</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- CENTER HUD -->

      <div id="screen">
        <div id="loginScreen">
          <h1 class="text-3xl font-bold mb-6">Tank Controller</h1>

          <input id="serverUrl" placeholder="Server URL" class="input" />

          <select id="player" class="input">
            <option value="p1">Player 1</option>

            <option value="p2">Player 2</option>
          </select>

          <input id="username" value="Driver" class="input" />

          <div class="flex gap-3 mt-4">
            <button id="connect" class="btn blue">Connect</button>

            <button id="start" class="btn green">Start</button>
          </div>

          <p id="statusText">Disconnected</p>
        </div>

        <div id="hud" class="hidden">
          <h2 id="playerName" class="text-2xl font-bold"></h2>

          <div class="mt-6">
            HP

            <div class="bar">
              <div id="healthBar"></div>
            </div>
          </div>

          <div class="mt-4">
            Shield

            <div class="bar">
              <div id="shieldBar"></div>
            </div>
          </div>

          <div class="mt-5">
            Ammo:

            <span id="ammo"> 10 </span>
          </div>

          <button id="end" class="btn bg-red-600 text-white mt-6">
            END GAME
          </button>
        </div>
      </div>

      <!-- RIGHT BUTTONS -->

      <div class="right-control">
        <button id="rotateLeft" class="rotate-btn">⟲</button>

        <button id="fire">FIRE</button>

        <button id="rotateRight" class="rotate-btn">⟳</button>
      </div>
    </div>
    <script>
      const playerInput = document.querySelector("#player");
      const usernameInput = document.querySelector("#username");
      const statusText = document.querySelector("#statusText");
      const connectButton = document.querySelector("#connect");
      const readyButton = document.querySelector("#ready");
      const countdownDisconnectButton = document.querySelector(
        "#countdownDisconnect",
      );
      const countdownNumber = document.querySelector("#countdownNumber");
      const gameDisconnectButton = document.querySelector("#gameDisconnect");
      const healthFill = document.querySelector("#healthFill");
      const healthValue = document.querySelector("#healthValue");
      const fireButton = document.querySelector("#fire");
      const endButton = document.querySelector("#end");
      const rotateLeftButton = document.querySelector("#rotateLeft");
      const rotateRightButton = document.querySelector("#rotateRight");
      const pregame = document.querySelector("#pregame");
      const game = document.querySelector("#game");
      const startButton = document.querySelector("#start");
      const serverInput = document.querySelector("#serverUrl");

      const defaultProtocol =
        window.location.protocol === "https:" ? "wss:" : "ws:";
      const serverUrl =
        serverInput.value ||
        `${defaultProtocol}//${window.location.host}/connect`;
      let socket;
      let seq = 0;
      let latest = {
        throttle: 0,
        steering: 0,
        fire: false,
        left: false,
        right: false,
      };
      let sendTimer;
      let joystick;

      function renderAxes() {
        document.querySelector("#throttle").textContent =
          latest.throttle.toFixed(2);

        document.querySelector("#steering").textContent =
          latest.steering.toFixed(2);
      }

      function initJoystick() {
        if (joystick) return;

        const joystickZone = document.querySelector("#joystick");

        joystick = nipplejs.create({
          zone: joystickZone,
          mode: "static",
          position: {
            left: "17%",
            top: "50%",
          },
          color: "#9ca3af",
          size: Math.min(window.innerHeight * 0.45, 180),
          multitouch: false,
        });

        joystick.on("move", (_event, data) => {
          latest.throttle = clamp(-(data.vector?.y ?? 0));

          latest.steering = clamp(data.vector?.x ?? 0);

          renderAxes();
        });

        joystick.on("end", () => {
          latest.throttle = 0;
          latest.steering = 0;

          renderAxes();
          sendInput();
        });
      }

      window.addEventListener("load", () => {
        initJoystick();
      });

      connectButton.addEventListener("click", () => {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.close();
          return;
        }
        connect();
      });

      startButton.addEventListener("click", async () => {
        sendJson({
          type: "start",
        });

        document.querySelector("#loginScreen").classList.add("hidden");

        document.querySelector("#hud").classList.remove("hidden");

        document.querySelector("#playerName").textContent = usernameInput.value;

        await enterLandscape();
      });

      fireButton.addEventListener("pointercancel", () => {
        latest.fire = false;
      });

      fireButton.addEventListener("pointerleave", () => {
        latest.fire = false;
      });

      fireButton.addEventListener("pointerdown", () => {
        latest.fire = true;
        document.querySelector("#fireState").textContent = "ON";
      });

      fireButton.addEventListener("pointerup", () => {
        latest.fire = false;
        document.querySelector("#fireState").textContent = "OFF";
      });

      fireButton.addEventListener("pointerleave", () => {
        latest.fire = false;
      });

      rotateLeftButton.addEventListener("pointerdown", () => {
        latest.left = true;
        document.querySelector("#leftState").textContent = "ON";
      });

      rotateLeftButton.addEventListener("pointerup", () => {
        latest.left = false;
        document.querySelector("#leftState").textContent = "OFF";
      });

      rotateLeftButton.addEventListener("pointerleave", () => {
        latest.left = false;
        document.querySelector("#leftState").textContent = "OFF";
      });

      rotateRightButton.addEventListener("pointerdown", () => {
        latest.right = true;
        document.querySelector("#rightState").textContent = "ON";
      });

      rotateRightButton.addEventListener("pointerup", () => {
        latest.right = false;
        document.querySelector("#rightState").textContent = "OFF";
      });

      rotateRightButton.addEventListener("pointerleave", () => {
        latest.right = false;
        document.querySelector("#rightState").textContent = "OFF";
      });

      gameDisconnectButton?.addEventListener("click", () => socket?.close());
      countdownDisconnectButton?.addEventListener("click", () =>
        socket?.close(),
      );

      endButton.addEventListener("click", () => {
        sendJson({
          type: "end",
        });

        // return to pregame
        document.querySelector("#hud").classList.add("hidden");

        document.querySelector("#loginScreen").classList.remove("hidden");

        latest = {
          throttle: 0,
          steering: 0,
          fire: false,
          left: false,
          right: false,
        };

        renderAxes();
      });

      function connect() {
        const url = new URL(serverUrl);
        url.searchParams.set("type", "controller");
        url.searchParams.set("player", playerInput.value);
        url.searchParams.set("username", usernameInput.value || "Driver");

        setStatus("Connecting", "bg-yellow-500");
        socket = new WebSocket(url.toString());
        socket.addEventListener("open", () => {
          setStatus("Connected");
          connectButton.textContent = "Disconnect";
          connectButton.classList.replace("bg-blue-600", "bg-gray-600");
          sendTimer = window.setInterval(sendInput, 50);
          requestState();
        });

        socket.addEventListener("close", () => {
          window.clearInterval(sendTimer);
          setStatus("Disconnected");
          connectButton.textContent = "Connect";
          connectButton.classList.replace("bg-gray-600", "bg-blue-600");
        });

        socket.addEventListener("error", () => setStatus("Error"));
      }

      function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
          alert("Please rotate your phone to landscape.");
        }
      }

      window.addEventListener("resize", checkOrientation);
      checkOrientation();

      function sendInput() {
        sendJson({
          throttle: latest.throttle,
          steering: latest.steering,
          fire: latest.fire,
          left: latest.left,
          right: latest.right,
          seq: ++seq,
          ts: Date.now(),
        });
      }

      function sendJson(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function stopMoving() {
        latest = {
          ...latest,
          throttle: 0,
          steering: 0,
        };

        renderAxes();
        sendInput();
      }

      function setStatus(text) {
        statusText.textContent = text;
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, value));
      }

      async function enterLandscape() {
        try {
          if (screen.orientation) {
            await screen.orientation.lock("landscape");
          }
        } catch (error) {
          console.log("Orientation lock unavailable", error);
        }
      }
    </script>
  </body>
</html>
