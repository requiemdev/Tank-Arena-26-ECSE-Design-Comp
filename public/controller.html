<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECSE Tank Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #29282f;
        --shell: #403d46;
        --bezel: #151922;
        --key: #5e6b78;
        --key-dark: #2d333d;
        --text: #edf2f7;
        --muted: #a9b3bd;
        --cyan: #48d9e9;
        --blue: #3da7ff;
        --yellow: #efc733;
        --red: #d92532;
        --line: #10141b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(circle at 14% 0%, rgba(255, 255, 255, 0.12), transparent 24rem),
          var(--shell);
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          monospace;
      }

      .controller-shell {
        min-height: 100dvh;
        width: 100%;
        max-width: none;
        padding: clamp(14px, 3vw, 28px);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 8rem),
          var(--shell);
        box-shadow: inset 0 0 0 2px #5a5660;
      }

      h1 {
        color: var(--red);
        font-size: 1rem;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow: 0 2px 0 var(--line);
      }

      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      input,
      select,
      button,
      .player-card,
      .meter {
        border: 2px solid var(--line);
        border-radius: 6px;
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.18), 0 4px 0 var(--line);
      }

      input,
      select {
        width: 100%;
        min-height: 40px;
        padding: 8px 14px 8px 16px;
        background: var(--key);
        color: var(--text);
        outline: none;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        border-color: var(--yellow);
      }

      button {
        min-height: 46px;
        color: #10141b;
        font-weight: 900;
        text-transform: uppercase;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          filter 120ms ease;
      }

      button:active {
        transform: translateY(3px);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), 0 1px 0 var(--line);
      }

      button:not(:disabled):hover {
        filter: brightness(1.08);
      }

      .connect-key {
        background: var(--cyan);
      }

      .ready-key {
        background: var(--blue);
      }

      .fire-key {
        background: var(--red);
        color: white;
      }

      .setup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 0.72rem;
        white-space: nowrap;
        padding: 7px 9px;
        background: var(--bezel);
        border: 2px solid var(--line);
        border-radius: 999px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 12px rgba(217, 37, 50, 0.85);
      }

      .dot.connected {
        background: var(--cyan);
        box-shadow: 0 0 12px rgba(72, 217, 233, 0.85);
      }

      .hidden {
        display: none !important;
      }

      #joystick {
        width: min(56vw, 340px);
        aspect-ratio: 1;
        position: relative;
        border-radius: 50%;
        pointer-events: none;
      }

      .pad {
        display: grid;
        place-items: center;
        min-height: 100%;
        position: relative;
        touch-action: none;
        user-select: none;
      }

      .meter {
        height: 10px;
        overflow: hidden;
        background: var(--bezel);
      }

      .meter-fill {
        height: 100%;
        border-radius: 0 999px 999px 0;
        background: linear-gradient(90deg, var(--cyan), var(--blue));
      }

      .player-card {
        background: var(--key-dark);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      #inGame > div {
        min-height: min(68dvh, 520px);
      }

      .fire-key {
        min-height: min(44dvh, 300px);
      }

      button:disabled,
      select:disabled,
      input:disabled {
        opacity: 0.55;
      }

      @media (min-width: 780px) {
        .controller-shell {
          padding: 24px;
        }

        .setup {
          grid-template-columns: 2fr 1fr 1fr;
        }

      }

      @media (orientation: landscape) and (max-height: 520px) {
        .controller-shell {
          min-height: 100dvh;
          padding: 12px 18px;
        }

        .controller-shell > div:first-child {
          margin-bottom: 8px;
        }

        #preGame {
          grid-template-columns: minmax(170px, 1fr) minmax(220px, 1.25fr) 1fr;
          align-items: end;
        }

        #preGame .grid {
          grid-column: auto;
        }

        #inGame {
          display: grid;
          grid-template-columns: minmax(250px, 1fr) minmax(260px, 1fr);
          gap: 14px;
          align-items: center;
        }

        #inGame > section {
          grid-column: 1 / -1;
          padding-bottom: 0;
        }

        #inGame > div {
          display: contents;
        }

        #inGame .pad,
        #inGame .actions {
          width: auto;
        }

        #joystick {
          width: min(74vh, 360px);
          margin: 0 auto;
        }

        .fire-key {
          min-height: min(64vh, 330px);
        }
      }
    </style>
  </head>
  <body>
    <main class="controller-shell text-sm">
      <div class="flex justify-between items-center">
        <h1 class="font-bold">Tank Controller</h1>

        <div class="status">
          <span id="statusDot" class="dot"></span
          ><span id="statusText">Disconnected</span>
        </div>
      </div>

      <section id="preGame" class="text-xs grid gap-2 pt-2">
        <label>
          Player
          <select id="player">
            <option value="p1">Player 1</option>
            <option value="p2">Player 2</option>
          </select>
        </label>
        <label>
          Name
          <input id="username" autocomplete="name" value="Driver" />
        </label>

        <div class="grid grid-cols-2 gap-2 col-span-2">
          <button id="connect" class="connect-key p-2" type="button">
            Connect
          </button>

          <button id="ready" class="ready-key p-2" type="button">
            Ready
          </button>
        </div>
      </section>

      <section id="inGame" class="hidden pt-2">
        <section class="flex gap-4 text-center items-center pb-3">
          <div class="flex items-center gap-2 w-full">
            <div class="w-12">HP</div>
            <div class="meter flex-1">
              <div class="meter-fill" style="width: 45%"></div>
            </div>
          </div>

          <div class="border-l-2 h-6"></div>

          <div class="flex items-center gap-2 w-full">
            <div class="w-16">Shield</div>
            <div class="meter flex-1">
              <div class="meter-fill" style="width: 45%"></div>
            </div>
          </div>
        </section>

        <div class="flex gap-4 items-center">
          <div class="pad w-1/2" aria-label="Joystick">
            <div id="joystick" class=""></div>
          </div>

          <div class="actions w-1/2">
            <button id="fire" class="fire-key p-2">
              Fire
            </button>
          </div>
        </div>
      </section>

      <section class="lobby-info grid grid-cols-2 gap-2 pt-2" aria-live="polite">
        <div id="p1Card" class="player-card p-2">
          <div class="font-bold">Player 1</div>
          <div id="p1State" class="text-xs" style="color: var(--muted)">Open</div>
        </div>
        <div id="p2Card" class="player-card p-2">
          <div class="font-bold">Player 2</div>
          <div id="p2State" class="text-xs" style="color: var(--muted)">Open</div>
        </div>
      </section>

      <div id="matchState" class="lobby-info pt-2 font-bold" aria-live="polite">
        Waiting for players
      </div>
    </main>

    <script>
      const playerInput = document.querySelector("#player");
      const usernameInput = document.querySelector("#username");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const connectButton = document.querySelector("#connect");
      const readyButton = document.querySelector("#ready");
      const fireButton = document.querySelector("#fire");
      const matchStateText = document.querySelector("#matchState");
      const p1StateText = document.querySelector("#p1State");
      const p2StateText = document.querySelector("#p2State");
      const preGame = document.querySelector("#preGame");
      const inGame = document.querySelector("#inGame");
      const lobbyInfo = document.querySelectorAll(".lobby-info");
      const joystickZone = document.querySelector(".pad");

      const defaultProtocol =
        window.location.protocol === "https:" ? "wss:" : "ws:";
      const serverUrl = `${defaultProtocol}//${window.location.host}/connect`;

      let socket;
      let seq = 0;
      let latest = { throttle: 0, steering: 0, fire: false };
      let sendTimer;
      let stateTimer;
      let gameState;
      let joystick;
      let fallbackJoystickReady = false;

      connectButton.addEventListener("click", () => {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.close();
          return;
        }
        connect();
      });

      readyButton.addEventListener("click", () => {
        const player = playerInput.value;
        const nextReady = !gameState?.players?.[player]?.ready;
        sendJson({ type: "ready", ready: nextReady });
      });

      fireButton.addEventListener("pointerdown", () => {
        latest.fire = true;
        sendInput();
      });

      fireButton.addEventListener("pointerup", () => {
        latest.fire = false;
        sendInput();
      });

      fireButton.addEventListener("pointercancel", () => {
        latest.fire = false;
        sendInput();
      });

      function connect() {
        const url = new URL(serverUrl);
        url.searchParams.set("type", "controller");
        url.searchParams.set("player", playerInput.value);
        url.searchParams.set("username", usernameInput.value || "Driver");

        setStatus("Connecting", false);
        socket = new WebSocket(url);

        socket.addEventListener("open", () => {
          setStatus("Connected", true);
          connectButton.textContent = "Disconnect";
          playerInput.disabled = true;
          usernameInput.disabled = true;
          sendTimer = window.setInterval(sendInput, 50);
          requestState();
        });

        socket.addEventListener("close", () => {
          window.clearInterval(sendTimer);
          setStatus("Disconnected", false);
          connectButton.textContent = "Connect";
          playerInput.disabled = false;
          usernameInput.disabled = false;
          updateControls();
        });

        socket.addEventListener("message", (event) => {
          const message = parseJson(event.data);
          if (message?.type === "state") {
            gameState = message.state;
            renderState();
          }
        });

        socket.addEventListener("error", () =>
          setStatus("Connection error", false),
        );
      }

      function sendInput() {
        sendJson({
          throttle: latest.throttle,
          steering: latest.steering,
          fire: latest.fire,
          seq: ++seq,
          ts: Date.now(),
        });
      }

      function sendJson(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      async function requestState() {
        sendJson({ type: "state" });

        try {
          const url = new URL(serverUrl);
          url.protocol = url.protocol === "wss:" ? "https:" : "http:";
          url.pathname = "/state";
          url.search = "";
          const response = await fetch(url);
          if (response.ok) {
            gameState = await response.json();
            renderState();
          }
        } catch {
          // The WebSocket state push remains the primary update path.
        }
      }

      function renderState() {
        if (!gameState) {
          return;
        }

        const { p1, p2 } = gameState.players;
        p1StateText.textContent = formatPlayerState(p1);
        p2StateText.textContent = formatPlayerState(p2);

        if (gameState.status === "COUNTDOWN") {
          matchStateText.textContent = `Starting in ${gameState.countdownSeconds}`;
        } else if (gameState.status === "ACTIVE") {
          matchStateText.textContent = `Match active: ${gameState.remainingSeconds}s left`;
        } else if (gameState.status === "ENDED") {
          matchStateText.textContent = gameState.winner
            ? `${gameState.players[gameState.winner].username} wins`
            : "Match ended in a draw";
        } else {
          matchStateText.textContent = bothReady()
            ? "Both players ready"
            : "Waiting for both players to ready up";
        }

        const inMatch = gameState.status === "COUNTDOWN" || gameState.status === "ACTIVE";
        preGame.classList.toggle("hidden", inMatch);
        inGame.classList.toggle("hidden", !inMatch);
        lobbyInfo.forEach((element) => element.classList.toggle("hidden", inMatch));
        if (inMatch) {
          window.requestAnimationFrame(setupJoystick);
        } else {
          teardownJoystick();
        }
        syncPlayerOptions();
        updateControls();
      }

      function formatPlayerState(player) {
        const connection = player.controllerConnected ? "Locked" : "Open";
        const ready = player.ready ? "Ready" : "Not ready";
        const tank = player.tankConnected ? "tank online" : "tank offline";
        return `${player.username}: ${connection}, ${ready}, ${tank}`;
      }

      function syncPlayerOptions() {
        const selected = playerInput.value;
        const connected = socket?.readyState === WebSocket.OPEN;
        for (const option of playerInput.options) {
          const player = gameState.players[option.value];
          option.disabled =
            player.controllerConnected && !(connected && option.value === selected);
          option.textContent = `${option.value === "p1" ? "Player 1" : "Player 2"}${
            option.disabled ? " (locked)" : ""
          }`;
        }

        if (playerInput.selectedOptions[0]?.disabled) {
          const openOption = Array.from(playerInput.options).find(
            (option) => !option.disabled,
          );
          if (openOption) {
            playerInput.value = openOption.value;
          }
        }
      }

      function updateControls() {
        const connected = socket?.readyState === WebSocket.OPEN;
        const player = gameState?.players?.[playerInput.value];
        const ready = Boolean(player?.ready);
        const lobbyStatus = !gameState || gameState.status === "LOBBY" || gameState.status === "ENDED";
        const selectedSlotLocked = Boolean(!connected && player?.controllerConnected);

        connectButton.disabled = selectedSlotLocked;
        readyButton.disabled = !connected || !lobbyStatus;
        readyButton.textContent = ready ? "Unready" : "Ready";
        fireButton.disabled = !connected || gameState?.status !== "ACTIVE";
      }

      function bothReady() {
        return Boolean(
          gameState?.players?.p1?.controllerConnected &&
            gameState?.players?.p2?.controllerConnected &&
            gameState?.players?.p1?.ready &&
            gameState?.players?.p2?.ready,
        );
      }

      function parseJson(value) {
        try {
          return JSON.parse(value);
        } catch {
          return null;
        }
      }

      function setupJoystick() {
        if (joystick || fallbackJoystickReady) {
          return;
        }

        const rect = joystickZone.getBoundingClientRect();
        if (!rect.width) {
          return;
        }

        if (!window.nipplejs) {
          setupFallbackJoystick();
          return;
        }

        const size = Math.min(190, rect.width, rect.height);
        joystick = nipplejs.create({
          zone: joystickZone,
          mode: "static",
          position: { left: `${rect.width / 2}px`, top: `${rect.height / 2}px` },
          size,
        });

        joystick.on("move", (_event, data) => {
          latest = {
            ...latest,
            throttle: clamp(data.vector?.y ?? 0),
            steering: clamp(data.vector?.x ?? 0),
          };
        });

        joystick.on("end", stopMoving);
      }

      function setupFallbackJoystick() {
        fallbackJoystickReady = true;
        joystickZone.addEventListener("pointerdown", handleFallbackPointer);
        joystickZone.addEventListener("pointermove", handleFallbackPointer);
        joystickZone.addEventListener("pointerup", stopMoving);
        joystickZone.addEventListener("pointercancel", stopMoving);
      }

      function teardownJoystick() {
        if (joystick) {
          joystick.destroy();
          joystick = null;
        }

        if (latest.throttle !== 0 || latest.steering !== 0) {
          stopMoving();
        }
      }

      function handleFallbackPointer(event) {
        if (event.type === "pointermove" && event.buttons === 0) {
          return;
        }

        const rect = joystickZone.getBoundingClientRect();
        const radius = Math.min(rect.width, rect.height) / 2;
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        latest = {
          ...latest,
          throttle: clamp((centerY - event.clientY) / radius),
          steering: clamp((event.clientX - centerX) / radius),
        };
      }

      function stopMoving() {
        latest = { ...latest, throttle: 0, steering: 0 };
        sendInput();
      }

      function setStatus(text, connected) {
        statusText.textContent = text;
        statusDot.classList.toggle("connected", connected);
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, value));
      }

      stateTimer = window.setInterval(requestState, 1000);
      requestState();
      updateControls();
    </script>
  </body>
</html>
