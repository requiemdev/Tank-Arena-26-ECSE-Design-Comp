<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ECSE Tank Controller</title>

    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        touch-action: none;
        background: #e5e7eb;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* ---------- PRE GAME ---------- */
      #pregame {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* ---------- GAME ---------- */
      #game {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background: #1f2937;
      }

      .controller {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .controls {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 25px;
        gap: 40px;
      }

      #joystick {
        width: 50%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        position: relative;
      }

      #fire {
        width: 50%;

        height: 85%;

        border-radius: 30px;

        font-size: 32px;

        font-weight: bold;

        color: white;

        background: #dc2626;

        border: 4px solid #991b1b;

        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      }

      #fire:active {
        transform: scale(0.95);
        background: #b91c1c;
      }

      .debug {
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.4);
        color: white;
      }

      .debug-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 5px 15px;
        border-radius: 9999px;
      }

      @media (max-width: 700px) {
        #fire {
          font-size: 22px;
        }
        .controls {
          padding: 15px;
          gap: 15px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================
         PRE GAME
    ===================== -->
    <div id="pregame">
      <div
        class="bg-white w-[90vw] max-w-[450px] p-6 rounded-2xl shadow-xl border border-gray-200"
      >
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-xl font-extrabold text-gray-800 tracking-tight">
            Tank Controller
          </h1>
          <div
            id="connectionStatus"
            class="flex items-center gap-2 text-sm font-medium text-gray-500"
          >
            <span
              id="statusDot"
              class="w-3 height h-3 rounded-full bg-red-500 transition-colors duration-300"
            ></span>
            <span id="statusText">Disconnected</span>
          </div>
        </div>

        <div class="space-y-4">
          <div class="flex flex-col gap-1.5">
            <label
              class="text-xs font-bold uppercase tracking-wider text-gray-500"
              >Edge Server</label
            >
            <input
              id="serverUrl"
              autocomplete="off"
              class="w-full px-3 py-2 border border-gray-300 rounded-xl bg-gray-50 text-gray-700 outline-none focus:border-blue-500 transition-all text-sm"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              class="text-xs font-bold uppercase tracking-wider text-gray-500"
              >Player Slot</label
            >
            <select
              id="player"
              class="w-full px-3 py-2 border border-gray-300 rounded-xl bg-gray-50 text-gray-700 outline-none focus:border-blue-500 transition-all text-sm"
            >
              <option value="p1">Player 1</option>
              <option value="p2">Player 2</option>
            </select>
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              class="text-xs font-bold uppercase tracking-wider text-gray-500"
              >Callsign / Name</label
            >
            <input
              id="username"
              value="Driver"
              class="w-full px-3 py-2 border border-gray-300 rounded-xl bg-gray-50 text-gray-700 outline-none focus:border-blue-500 transition-all text-sm"
            />
          </div>
        </div>

        <div class="flex gap-3 mt-6">
          <button
            id="connect"
            class="flex-1 rounded-xl py-3 font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md active:scale-[0.98] transition-all text-sm"
          >
            Connect
          </button>
          <button
            id="start"
            class="flex-1 rounded-xl py-3 font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md active:scale-[0.98] transition-all text-sm"
          >
            Start Game
          </button>
        </div>
      </div>
    </div>

    <!-- =====================
         GAME
    ===================== -->
    <div id="game" class="hidden">
      <div class="controller">
        <div class="controls">
          <div id="joystick"></div>
          <button id="fire">FIRE</button>
        </div>

        <div class="debug">
          <div class="debug-box">
            Throttle:
            <strong id="throttle" class="text-emerald-400">0.00</strong>
          </div>
          <div class="debug-box">
            Steering: <strong id="steering" class="text-cyan-400">0.00</strong>
          </div>
        </div>
      </div>
    </div>

    <script>
      const serverUrlInput = document.querySelector("#serverUrl");
      const playerInput = document.querySelector("#player");
      const usernameInput = document.querySelector("#username");
      const statusDot = document.querySelector("#statusDot");
      const statusText = document.querySelector("#statusText");
      const throttleText = document.querySelector("#throttle");
      const steeringText = document.querySelector("#steering");
      const connectButton = document.querySelector("#connect");
      const startButton = document.querySelector("#start");
      const fireButton = document.querySelector("#fire");
      const pregame = document.querySelector("#pregame");
      const game = document.querySelector("#game");

      const defaultProtocol =
        window.location.protocol === "https:" ? "wss:" : "ws:";
      serverUrlInput.value = `${defaultProtocol}//${window.location.host}/connect`;

      let socket;
      let seq = 0;
      let latest = { throttle: 0, steering: 0, fire: false };
      let sendTimer;
      let joystick;

      function initJoystick() {
        if (joystick) return;
        const joystickZone = document.querySelector("#joystick");
        if (!window.nipplejs) return;

        joystick = nipplejs.create({
          zone: joystickZone,
          mode: "static",
          position: { left: "25%", top: "50%" },
          color: "#9ca3af",
          size: 180,
        });

        joystick.on("move", (_event, data) => {
          latest = {
            ...latest,
            throttle: clamp(-(data.vector?.y ?? 0)),
            steering: clamp(data.vector?.x ?? 0),
          };
          renderAxes();
        });

        joystick.on("end", stopMoving);
      }

      connectButton.addEventListener("click", () => {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.close();
          return;
        }
        connect();
      });

      startButton.addEventListener("click", async () => {
        sendJson({ type: "start" });

        // FIX: Override CSS ID specificity rule directly
        pregame.style.display = "none";
        game.classList.remove("hidden");

        requestAnimationFrame(() => {
          initJoystick();
        });

        await enterLandscape();
      });

      fireButton.addEventListener("pointerdown", () => {
        latest.fire = true;
        sendInput();
      });

      fireButton.addEventListener("pointerup", () => {
        latest.fire = false;
        sendInput();
      });

      fireButton.addEventListener("pointercancel", () => {
        latest.fire = false;
        sendInput();
      });

      function connect() {
        const url = new URL(serverUrlInput.value);
        url.searchParams.set("type", "controller");
        url.searchParams.set("player", playerInput.value);
        url.searchParams.set("username", usernameInput.value || "Driver");

        setStatus("Connecting", "bg-yellow-500");
        socket = new WebSocket(url);

        socket.addEventListener("open", () => {
          setStatus("Connected", "bg-emerald-500");
          connectButton.textContent = "Disconnect";
          connectButton.classList.replace("bg-blue-600", "bg-gray-600");
          sendTimer = window.setInterval(sendInput, 50);
        });

        socket.addEventListener("close", () => {
          window.clearInterval(sendTimer);
          setStatus("Disconnected", "bg-red-500");
          connectButton.textContent = "Connect";
          connectButton.classList.replace("bg-gray-600", "bg-blue-600");
        });

        socket.addEventListener("error", () =>
          setStatus("Error", "bg-red-500"),
        );
      }

      function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
          alert("Please rotate your phone to landscape.");
        }
      }

      window.addEventListener("resize", checkOrientation);
      checkOrientation();

      function sendInput() {
        sendJson({
          throttle: latest.throttle,
          steering: latest.steering,
          fire: latest.fire,
          seq: ++seq,
          ts: Date.now(),
        });
      }

      function sendJson(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function stopMoving() {
        latest = { ...latest, throttle: 0, steering: 0 };
        renderAxes();
        sendInput();
      }

      function setStatus(text, dotColorClass) {
        statusText.textContent = text;
        statusDot.className = `w-3 h-3 rounded-full transition-colors duration-300 ${dotColorClass}`;
      }

      function renderAxes() {
        throttleText.textContent = latest.throttle.toFixed(2);
        steeringText.textContent = latest.steering.toFixed(2);
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, value));
      }

      async function enterLandscape() {
        try {
          if (screen.orientation) {
            await screen.orientation.lock("landscape");
          }
        } catch (error) {
          console.log("Orientation lock unavailable", error);
        }
      }
    </script>
  </body>
</html>
