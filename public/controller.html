<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECSE Tank Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101419;
        --panel: #1b242d;
        --panel-2: #24313c;
        --text: #f5f7fa;
        --muted: #a9b5bf;
        --accent: #34c759;
        --danger: #ff453a;
        --line: #34424f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        min-height: 100vh;
        padding: 16px;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      input,
      select,
      button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      input,
      select {
        padding: 0 12px;
      }

      button {
        padding: 0 16px;
        font-weight: 700;
      }

      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #07110a;
      }

      button.danger {
        border-color: transparent;
        background: var(--danger);
        color: #fff;
      }

      .setup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .setup label:first-child {
        grid-column: 1 / -1;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
      }

      .dot.connected {
        background: var(--accent);
      }

      .pad {
        display: grid;
        place-items: center;
        min-height: 320px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        touch-action: none;
      }

      #joystick {
        width: min(78vw, 420px);
        aspect-ratio: 1;
        position: relative;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .telemetry {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      @media (min-width: 780px) {
        main {
          max-width: 860px;
          margin: 0 auto;
          padding: 24px;
        }

        .setup {
          grid-template-columns: 2fr 1fr 1fr;
        }

        .setup label:first-child {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Tank Controller</h1>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Disconnected</span></div>
      </header>

      <section class="setup" aria-label="Connection settings">
        <label>
          Edge server
          <input id="serverUrl" autocomplete="off" />
        </label>
        <label>
          Player
          <select id="player">
            <option value="p1">Player 1</option>
            <option value="p2">Player 2</option>
          </select>
        </label>
        <label>
          Name
          <input id="username" autocomplete="name" value="Driver" />
        </label>
      </section>

      <section class="pad" aria-label="Joystick">
        <div id="joystick"></div>
      </section>

      <section class="telemetry" aria-live="polite">
        <div>Throttle <strong id="throttle">0.00</strong></div>
        <div>Steering <strong id="steering">0.00</strong></div>
      </section>

      <footer class="actions">
        <button id="connect" class="primary" type="button">Connect</button>
        <button id="start" type="button">Start</button>
        <button id="fire" class="danger" type="button">Fire</button>
      </footer>
    </main>

    <script>
      const serverUrlInput = document.querySelector('#serverUrl');
      const playerInput = document.querySelector('#player');
      const usernameInput = document.querySelector('#username');
      const statusDot = document.querySelector('#statusDot');
      const statusText = document.querySelector('#statusText');
      const throttleText = document.querySelector('#throttle');
      const steeringText = document.querySelector('#steering');
      const connectButton = document.querySelector('#connect');
      const startButton = document.querySelector('#start');
      const fireButton = document.querySelector('#fire');

      const defaultProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      serverUrlInput.value = `${defaultProtocol}//${window.location.host}/connect`;

      let socket;
      let seq = 0;
      let latest = { throttle: 0, steering: 0, fire: false };
      let sendTimer;

      const joystickZone = document.querySelector('#joystick');

      if (window.nipplejs) {
        const joystick = nipplejs.create({
          zone: joystickZone,
          mode: 'static',
          position: { left: '50%', top: '50%' },
          color: '#f5f7fa',
          size: 190
        });

        joystick.on('move', (_event, data) => {
          latest = {
            ...latest,
            throttle: clamp(-(data.vector?.y ?? 0)),
            steering: clamp(data.vector?.x ?? 0)
          };
          renderAxes();
        });

        joystick.on('end', stopMoving);
      } else {
        joystickZone.style.border = '1px solid var(--line)';
        joystickZone.style.borderRadius = '50%';
        joystickZone.addEventListener('pointerdown', handleFallbackPointer);
        joystickZone.addEventListener('pointermove', handleFallbackPointer);
        joystickZone.addEventListener('pointerup', stopMoving);
        joystickZone.addEventListener('pointercancel', stopMoving);
      }

      connectButton.addEventListener('click', () => {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.close();
          return;
        }
        connect();
      });

      startButton.addEventListener('click', () => sendJson({ type: 'start' }));

      fireButton.addEventListener('pointerdown', () => {
        latest.fire = true;
        sendInput();
      });

      fireButton.addEventListener('pointerup', () => {
        latest.fire = false;
        sendInput();
      });

      fireButton.addEventListener('pointercancel', () => {
        latest.fire = false;
        sendInput();
      });

      function connect() {
        const url = new URL(serverUrlInput.value);
        url.searchParams.set('type', 'controller');
        url.searchParams.set('player', playerInput.value);
        url.searchParams.set('username', usernameInput.value || 'Driver');

        setStatus('Connecting', false);
        socket = new WebSocket(url);

        socket.addEventListener('open', () => {
          setStatus('Connected', true);
          connectButton.textContent = 'Disconnect';
          sendTimer = window.setInterval(sendInput, 50);
        });

        socket.addEventListener('close', () => {
          window.clearInterval(sendTimer);
          setStatus('Disconnected', false);
          connectButton.textContent = 'Connect';
        });

        socket.addEventListener('error', () => setStatus('Connection error', false));
      }

      function sendInput() {
        sendJson({
          throttle: latest.throttle,
          steering: latest.steering,
          fire: latest.fire,
          seq: ++seq,
          ts: Date.now()
        });
      }

      function sendJson(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function handleFallbackPointer(event) {
        if (event.buttons === 0) {
          return;
        }

        const rect = joystickZone.getBoundingClientRect();
        const radius = rect.width / 2;
        latest = {
          ...latest,
          throttle: clamp((rect.top + radius - event.clientY) / radius),
          steering: clamp((event.clientX - rect.left - radius) / radius)
        };
        renderAxes();
      }

      function stopMoving() {
        latest = { ...latest, throttle: 0, steering: 0 };
        renderAxes();
        sendInput();
      }

      function setStatus(text, connected) {
        statusText.textContent = text;
        statusDot.classList.toggle('connected', connected);
      }

      function renderAxes() {
        throttleText.textContent = latest.throttle.toFixed(2);
        steeringText.textContent = latest.steering.toFixed(2);
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, value));
      }
    </script>
  </body>
</html>
