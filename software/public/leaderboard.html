<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fastest Tank Games</title>
  <style>
    :root {
      color-scheme: light;
      --screen: #b8bd68;
      --ink: #272929;
      --shell: #c4bebb;
      --control: #494786;
      --danger: #9a2257;
      font-family: Arial, sans-serif;
      background: var(--shell);
      color: var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      padding: clamp(16px, 5vw, 48px);
      background: var(--shell);
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      text-align: center;
      font-size: clamp(1.65rem, 6vw, 2.5rem);
    }

    .table-shell {
      margin-top: clamp(20px, 5vw, 32px);
      overflow: hidden;
      border: 0.2rem solid var(--ink);
      border-radius: 12px;
      background: var(--screen);
      box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.28);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: clamp(9px, 2.5vw, 14px) clamp(4px, 1.8vw, 12px);
      text-align: center;
      overflow-wrap: anywhere;
    }

    th {
      background: var(--control);
      color: #fff;
      font-size: clamp(0.68rem, 2.5vw, 0.85rem);
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    td {
      border-bottom: 1px solid rgba(39, 41, 41, 0.45);
      font-size: clamp(0.74rem, 2.8vw, 1rem);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(39, 41, 41, 0.1);
    }

    .rank {
      font-weight: 700;
    }

    .players {
      line-height: 1.35;
    }

    .versus {
      color: rgba(39, 41, 41, 0.65);
      font-size: 0.78em;
    }

    .winner {
      color: var(--control);
      font-weight: 700;
    }

    .duration {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .message {
      padding: 28px 12px;
      color: var(--ink);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 520px) {
      .versus {
        display: block;
        line-height: 1.1;
      }

      th {
        letter-spacing: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tank Arena Leaderboard</h1>

    <div class="table-shell">
      <table>
        <colgroup>
          <col style="width: 8%">
          <col style="width: 31%">
          <col style="width: 24%">
          <col style="width: 16%">
          <col style="width: 21%">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Players</th>
            <th scope="col">Winner</th>
            <th scope="col">Score</th>
            <th scope="col">Game duration</th>
          </tr>
        </thead>
        <tbody id="leaderboard" aria-live="polite"></tbody>
      </table>
    </div>
  </main>

  <script>
    const leaderboardBody = document.getElementById("leaderboard");

    function displayName(name, playerSlot) {
      const normalizedName = String(name || "").trim();
      if (/^esp32[-_ ]?tank$/i.test(normalizedName)) {
        if (playerSlot === "p1") return "Player 1";
        if (playerSlot === "p2") return "Player 2";
        return "Player";
      }

      if (normalizedName) return normalizedName;
      if (playerSlot === "p1") return "Player 1";
      if (playerSlot === "p2") return "Player 2";
      return "Unknown";
    }

    function winnerSlot(match) {
      const winnerName = String(match.winner_name || "").trim();
      const playerOneName = String(match.player1_name || "").trim();
      const playerTwoName = String(match.player2_name || "").trim();

      if (winnerName === playerOneName && winnerName !== playerTwoName) return "p1";
      if (winnerName === playerTwoName && winnerName !== playerOneName) return "p2";
      if (Number(match.player1_score) > Number(match.player2_score)) return "p1";
      if (Number(match.player2_score) > Number(match.player1_score)) return "p2";
      return null;
    }

    function formatDuration(value) {
      const totalSeconds = Number(value);
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return "—";

      const roundedSeconds = Math.round(totalSeconds);
      const minutes = Math.floor(roundedSeconds / 60);
      const seconds = roundedSeconds % 60;
      return minutes > 0 ? `${minutes}:${String(seconds).padStart(2, "0")}` : `${seconds}s`;
    }

    function addCell(row, value, className) {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      row.appendChild(cell);
      return cell;
    }

    function renderMessage(message, isError = false) {
      const row = document.createElement("tr");
      const cell = addCell(row, message, `message${isError ? " error" : ""}`);
      cell.colSpan = 5;
      leaderboardBody.replaceChildren(row);
    }

    function renderMatches(matches) {
      if (matches.length === 0) {
        renderMessage("No completed games with a winner yet");
        return;
      }

      const fragment = document.createDocumentFragment();
      matches.forEach((match, index) => {
        const row = document.createElement("tr");
        addCell(row, String(index + 1), "rank");

        const playersCell = document.createElement("td");
        playersCell.className = "players";
        const playerOne = document.createElement("span");
        const versus = document.createElement("span");
        const playerTwo = document.createElement("span");
        playerOne.textContent = displayName(match.player1_name, "p1");
        versus.className = "versus";
        versus.textContent = " vs ";
        playerTwo.textContent = displayName(match.player2_name, "p2");
        playersCell.append(playerOne, versus, playerTwo);
        row.appendChild(playersCell);

        addCell(row, displayName(match.winner_name, winnerSlot(match)), "winner");
        addCell(row, `${match.player1_score}–${match.player2_score}`, "score");
        addCell(row, formatDuration(match.game_duration_seconds), "duration");
        fragment.appendChild(row);
      });

      leaderboardBody.replaceChildren(fragment);
    }

    async function loadLeaderboard() {
      try {
        const response = await fetch("/api/leaderboard");
        if (!response.ok) throw new Error(`Server returned ${response.status}`);

        const matches = await response.json();
        if (!Array.isArray(matches)) throw new Error("Leaderboard response is not an array");
        renderMatches(matches);
      } catch (error) {
        console.error("Failed to load leaderboard:", error);
        renderMessage("Failed to load leaderboard", true);
      }
    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 5000);
  </script>
</body>
</html>
